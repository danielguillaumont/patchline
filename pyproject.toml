[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "patchline"
version = "0.1.0"
description = "Reproducible vulnerability intelligence analytics built from public data"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {text = "MIT"}
authors = [{name = "Patchline contributors"}]
dependencies = [
    "duckdb>=1.1,<2",
    "httpx>=0.27,<1",
    "jsonschema[format]>=4.23,<5",
]

[dependency-groups]
dev = [
    "dbt-duckdb>=1.9,<2",
    "pytest>=8.3,<10",
    "ruff>=0.9,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/patchline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
