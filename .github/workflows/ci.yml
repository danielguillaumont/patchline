name: Offline Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Run fixture doctor
        run: uv run --locked python -m patchline doctor --fixture
      - name: Test
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check .

  dbt:
    name: dbt offline fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Create isolated synthetic warehouse
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse create --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify dbt adapter and parse
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: |
          uv run --locked dbt debug --project-dir dbt --profiles-dir dbt
          uv run --locked dbt parse --project-dir dbt --profiles-dir dbt
      - name: Build and test dbt staging
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: |
          uv run --locked dbt run --project-dir dbt --profiles-dir dbt
          uv run --locked dbt test --project-dir dbt --profiles-dir dbt
      - name: Check staging counts and fixture lineage
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify --output "$PATCHLINE_DUCKDB_PATH"
      - name: Check full-union KEV EPSS model and null policy
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-joins --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify M03 coverage metric contract and source dates
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-m03 --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify M04 full-population distribution and score quantiles
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-m04 --output "$PATCHLINE_DUCKDB_PATH"
