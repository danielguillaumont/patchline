name: Offline Foundation CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Run fixture doctor
        run: uv run --locked python -m patchline doctor --fixture
      - name: Test
        run: uv run --locked pytest
      - name: Lint
        run: uv run --locked ruff check .

  frontend:
    name: Spectral Index frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked frontend dependencies
        run: npm ci
      - name: Test frontend contracts
        run: npm test
      - name: Build frontend
        run: npm run build
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Prepare fixture toolchain for browser tests
        working-directory: .
        run: uv sync --locked --python 3.12
      - name: Install Playwright Chromium and Linux dependencies
        run: npx playwright install --with-deps chromium
      - name: Test browser interactions and responsive widths
        run: npm run test:e2e
      - name: Upload browser screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spectral-index-browser-evidence
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 14

  dbt:
    name: dbt offline fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --python 3.12
      - name: Create isolated synthetic warehouse
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse create --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify dbt adapter and parse
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: |
          uv run --locked dbt debug --project-dir dbt --profiles-dir dbt
          uv run --locked dbt parse --project-dir dbt --profiles-dir dbt
      - name: Build and test dbt staging
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: |
          uv run --locked dbt run --project-dir dbt --profiles-dir dbt
          uv run --locked dbt test --project-dir dbt --profiles-dir dbt
      - name: Check staging counts and fixture lineage
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify --output "$PATCHLINE_DUCKDB_PATH"
      - name: Check full-union KEV EPSS model and null policy
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-joins --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify M03 coverage metric contract and source dates
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-m03 --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify M04 full-population distribution and score quantiles
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-m04 --output "$PATCHLINE_DUCKDB_PATH"
      - name: Verify M05 KEV and EPSS cohort reconciliation
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
        run: uv run --locked python -m patchline.fixtures.ci_warehouse verify-m05 --output "$PATCHLINE_DUCKDB_PATH"
      - name: Publish and verify synthetic analytical exports
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
          PATCHLINE_EXPORT_DIR: ${{ runner.temp }}/patchline-ci-exports
        run: |
          uv run --locked python -m patchline.exports.analytics create --database "$PATCHLINE_DUCKDB_PATH" --output "$PATCHLINE_EXPORT_DIR"
          uv run --locked python -m patchline.exports.analytics verify --output "$PATCHLINE_EXPORT_DIR"
      - name: Publish and verify v2 M05 cohort exports
        env:
          PATCHLINE_DUCKDB_PATH: ${{ runner.temp }}/patchline-ci.duckdb
          PATCHLINE_EXPORT_DIR: ${{ runner.temp }}/patchline-ci-exports-v2
        run: |
          uv run --locked python -m patchline.exports.analytics create --contract v2 --database "$PATCHLINE_DUCKDB_PATH" --output "$PATCHLINE_EXPORT_DIR"
          uv run --locked python -m patchline.exports.analytics verify --output "$PATCHLINE_EXPORT_DIR"
